[pytest]
testpaths = test
norecursedirs =
    STALE
    .git
    .pytest_cache
    __pycache__
xfail_strict = true
markers =
    contract: future behavior contract tests for not-yet-implemented modules
    codex_exec: tests that run real codex exec probes when explicitly enabled
    real_battlefield: tests that run real Codex, SSH, and GPU MCP against shared /net repos
