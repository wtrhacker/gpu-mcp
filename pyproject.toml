[project]
name = "gpu-mcp"
version = "0.0.0"
description = "Config-driven GPU cluster MCP server experiments and contracts."
requires-python = ">=3.11"
dependencies = [
    "fabric",
    "mcp>=1.28,<2",
    "paramiko",
    "uvicorn",
    "websocket-client",
]

[project.optional-dependencies]
test = [
    "jsonschema",
    "pytest",
]
